# A regular-season game in a league that always plays an extra end (rules.extra_end: always).
fixture:
  folder: games
  game_type: regular
  options: {extra_end: always}
sheet:
  hammer: home
  ends:
    home: [1, 0, 2, 0, 0, 1, 0, 0]
    away: [0, 1, 0, 1, 2, 0, 0, 0]
  extra:
    home: [0]
    away: [2]
  final: {home: 4, away: 6}
  lineups:
    home:
    - {player: carol-d, position: lead}
    - {player: ken-w, position: second}
    - {player: linda-f, position: vice}
    - {player: doug-h, position: skip}
    away:
    - {player: pat-o, position: lead}
    - {player: brian-s, position: second}
    - {player: joanne-t, position: vice}
    - {player: wayne-b, position: skip}
