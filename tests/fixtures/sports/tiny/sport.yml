# A tiny made-up sport for the config and sport-schema tests (not a real sport).
name: Tiny
default_layout: classic
games_per_day: 1
game_minutes: 45
words:
  period: {one: Half, many: Halves, short: H}
  surface: Court
  day: Week
  points_for: {label: PF, title: Points for}
  points_against: {label: PA, title: Points against}
line_score: {shape: periods, total_label: Final, corner: Team}
options:
  periods:  {type: int, default: 2, min: 1, max: 9}
  overtime: {type: choice, values: [none, overtime], default: none, decide: true}
  mercy:    {type: bool, default: false}
  venue_note: {type: text, default: ""}
standings:
  points: {win: 2, tie: 1, loss: 0}
  ties: true
  forfeit: {value: {score: [1, 0]}, decide: true}
  tiebreakers: {value: [head_to_head, diff, points_for], decide: true}
  columns: [gp, w, l, t, pts, pf, pa, diff, ends]
stats:
  player:
    - {key: pts, label: PTS, title: Points}
  derived:
    - {key: ppg, label: PPG, title: Points per game, places: 1}
  team:
    - {key: ends, label: EW, title: Ends won}
minimums:
  ppg_min_games: {default: 0, decide: true, note: "Minimum {value} games played."}
leaderboards:
  - {id: pts, of: player, group: player, stat: pts, label: Points, tile: true, edge: hot, detail: "{gp} GP"}
  - {id: ppg, of: player, group: player, stat: ppg, label: Points / game, tile: true, edge: accent,
     min: {stat: gp, setting: ppg_min_games, cap_at_team_games: true}, detail: "{pts} pts in {gp} GP"}
labels: {results: Latest results, next: Next game day, leaders: Leaders}
labels_by_layout: {scoreboard: {leaders: Buckets}}
display: {card: rows, card_foot: note, surface: label}
positions: []
